name: Quiz Scheduler

on:
  schedule:
    # Wakes up every 15 minutes (UTC) and posts whatever is due in schedule.json.
    # The quiz times are NOT set here - edit schedule.json to change them.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      quiz:
        description: "Post this quiz now, ignoring the schedule (e.g. ows001). Leave empty to run the normal schedule check."
        required: false
        default: ""
        type: string

# "write" is needed so the run can commit sent.json (the record of posted quizzes).
permissions:
  contents: write

# Never run two copies at once, otherwise a quiz could be posted twice.
concurrency:
  group: quiz-scheduler
  cancel-in-progress: false

jobs:
  post-quizzes:
    runs-on: ubuntu-latest
    # A run lasts about (questions x seconds per question); stop anything that hangs for far longer.
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Always use the newest main, so a run that waited in the queue still
          # sees the latest sent.json and cannot post the same quiz twice.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post due quizzes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_QUIZ: ${{ inputs.quiz }}
        run: |
          if [ -n "$MANUAL_QUIZ" ]; then
            python quiz_bot.py --quiz "$MANUAL_QUIZ"
          else
            python quiz_bot.py
          fi

      - name: Save records
        if: always()
        run: |
          for f in sent.json scores.json stats.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update records"
            git pull --rebase
            git push
          fi
