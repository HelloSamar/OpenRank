name: Quiz Scheduler

on:
  schedule:
    # Wakes up every 15 minutes (UTC) and posts whatever is due in schedule.json.
    # The quiz times are NOT set here - edit schedule.json to change them.
    # The minutes are 7, 22, 37 and 52 on purpose: GitHub delays scheduled runs most at the
    # start of the hour, so the checks stay away from :00.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      quiz:
        description: "Post this quiz now, ignoring the schedule: the file name without .json (e.g. Idioms_idm). Leave empty to run the normal schedule check."
        required: false
        default: ""
        type: string
      test_chat:
        description: "Only with a quiz name: post it to the test chat (secret TEST_CHAT_ID) instead of the real group. Nothing is recorded."
        required: false
        default: false
        type: boolean

# "write" is needed so the run can commit sent.json (the record of posted quizzes).
permissions:
  contents: write

# Never run two copies at once, otherwise a quiz could be posted twice.
concurrency:
  group: quiz-scheduler
  cancel-in-progress: false

jobs:
  post-quizzes:
    runs-on: ubuntu-latest
    # A run lasts about (questions x seconds per question); stop anything that hangs for far longer.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Always use the newest main, so a run that waited in the queue still
          # sees the latest sent.json and cannot post the same quiz twice.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post due quizzes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          OWNER_USERNAME: ${{ vars.OWNER_USERNAME }}
          DISABLE_COMMANDS: ${{ vars.DISABLE_COMMANDS }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          SCORES_SALT: ${{ secrets.SCORES_SALT }}
          MANUAL_QUIZ: ${{ inputs.quiz }}
          USE_TEST_CHAT: ${{ inputs.test_chat }}
        run: |
          if [ -n "$MANUAL_QUIZ" ]; then
            if [ "$USE_TEST_CHAT" = "true" ]; then
              python quiz_bot.py --quiz "$MANUAL_QUIZ" --test-chat
            else
              python quiz_bot.py --quiz "$MANUAL_QUIZ"
            fi
          else
            python quiz_bot.py
          fi

      - name: Save records
        if: always()
        run: |
          for f in sent.json scores.json stats.json alerts.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update records"
            git pull --rebase
            git push
          fi
