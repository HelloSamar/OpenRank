name: Quiz Scheduler

on:
  schedule:
    # Wakes up every 15 minutes (UTC) and posts whatever is due in schedule.json.
    # The quiz times are NOT set here - edit schedule.json to change them.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      quiz:
        description: "Post this quiz now, ignoring the schedule (e.g. ows001). Leave empty to run the normal schedule check."
        required: false
        default: ""
        type: string

# "write" is needed so the run can commit sent.json (the record of posted quizzes).
permissions:
  contents: write

# Never run two copies at once, otherwise a quiz could be posted twice.
concurrency:
  group: quiz-scheduler
  cancel-in-progress: false

jobs:
  post-quizzes:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post due quizzes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_QUIZ: ${{ inputs.quiz }}
        run: |
          if [ -n "$MANUAL_QUIZ" ]; then
            python quiz_bot.py --quiz "$MANUAL_QUIZ"
          else
            python quiz_bot.py
          fi

      - name: Save sent record
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent.json
            git commit -m "Update sent record"
            git pull --rebase
            git push
          fi
