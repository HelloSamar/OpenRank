name: Validate

# Runs whenever quizzes, the schedule, the scripts or the worker change, and shows a red cross
# if something is broken (for example a missing comma in schedule.json).
on:
  pull_request:
    paths:
      - "quizzes/**"
      - "schedule.json"
      - "quiz_bot.py"
      - "responder.py"
      - "requirements.txt"
      - "tests/**"
      - "schema.sql"
      - "worker/**"
      - ".gitignore"
      - ".github/workflows/**"
  push:
    paths:
      - "quizzes/**"
      - "schedule.json"
      - "quiz_bot.py"
      - "responder.py"
      - "tests/**"
      - "requirements.txt"
      - "schema.sql"
      - "worker/**"
      - ".gitignore"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check schedule and quiz files
        run: python quiz_bot.py --dry-run

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  worker:
    name: Worker (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run worker tests
        run: npm test
